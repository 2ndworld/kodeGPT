name: Phase 2 Final CI Fix

on:
  push:
    branches: ["feat/preview-scoped-browser-evidence"]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/preview-scoped-browser-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm 10.15.0
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          test "$(pnpm --version)" = "10.15.0"

      - name: Setup Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Apply exact final fixes
        run: python .github/phase2-ci-fix.py

      - name: Frozen dependency install
        env:
          CI: "true"
        run: pnpm install --frozen-lockfile

      - name: Typecheck and release unit tests
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm exec vitest run \
            apps/cli/src/service/release.test.ts \
            apps/cli/src/service/release-provenance.test.ts

      - name: Previously failing surface tests
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            tests/integration/mcp-conformance.test.ts \
            tests/integration/mcp-http.test.ts \
            tests/integration/mcp-stdio.test.ts \
            tests/integration/provider-gateway.test.ts \
            tests/security/security-invariants.test.ts \
            apps/cli/src/commands/service.test.ts

      - name: Previously failing packaged CLI tests
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            tests/integration/cli-bridge.test.ts \
            tests/integration/cli-expose-zrok.test.ts \
            tests/integration/cli-service.test.ts \
            tests/integration/cli-workspace.test.ts \
            apps/cli/src/packaged-cli.test.ts

      - name: Host Chrome dynamic WebSocket policy spike
        env:
          KODEGPT_BROWSER_SPIKE: "1"
        run: |
          set -euo pipefail
          google-chrome --version
          pnpm exec vitest run packages/core/src/playwright-browser-driver.spike.test.ts

      - name: Remove temporary CI fix machinery and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase2-ci-fix.yml
          rm .github/phase2-ci-fix.py
          rm .github/phase2-ci-fix.patch
          rm .github/phase2-packaging-fix.patch
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: reconcile Phase 2 surface and packaging gates"
          git push origin "HEAD:feat/preview-scoped-browser-evidence"
