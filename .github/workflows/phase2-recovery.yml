name: Phase 2 Recovery Executor

on:
  push:
    branches: ["feat/preview-scoped-browser-evidence"]
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[phase2-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/preview-scoped-browser-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm 10.15.0
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          test "$(pnpm --version)" = "10.15.0"

      - name: Setup Rust stable
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Apply exact Phase 2 recovery edits
        run: python .github/phase2-recovery.py

      - name: Generate deterministic lockfile
        env:
          CI: "true"
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Format Rust changes
        run: cargo fmt --all

      - name: Typecheck
        run: pnpm run typecheck

      - name: Focused TypeScript tests
        run: |
          set -euo pipefail
          pnpm --filter @kodegpt/artifacts test
          pnpm --filter @kodegpt/core test
          pnpm --filter @kodegpt/mcp-server test
          pnpm exec vitest run tests/protocol/runtime-schema.test.ts

      - name: Private artifact write integration
        run: cargo test -p kodegpt-runtime --test artifact_write

      - name: Host Chrome compatibility spike
        env:
          KODEGPT_BROWSER_SPIKE: "1"
        run: |
          set -euo pipefail
          google-chrome --version
          pnpm exec vitest run packages/core/src/playwright-browser-driver.spike.test.ts

      - name: Remove recovery machinery and commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase2-recovery.yml
          rm .github/phase2-recovery.py
          rm .github/phase2-recovery.patch
          rm .github/phase2-recovery-extra.patch
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: integrate preview-scoped browser evidence [phase2-applied]"
          git push origin "HEAD:feat/preview-scoped-browser-evidence"
