name: Task 16 functional gate

on:
  pull_request:
    branches:
      - feat/kodegpt-v0.1-task15-clean

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Exit when gate already recorded
        id: recorded
        run: |
          if [ -f docs/implementation/evidence/.task16-functional-targeted-pass.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.recorded.outputs.skip != 'true'
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        if: steps.recorded.outputs.skip != 'true'
        with:
          version: 10.15.0
          run_install: false
      - name: Install dependencies and trusted runtime fixtures
        if: steps.recorded.outputs.skip != 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libcap-dev libselinux1-dev
          sudo chown root:root /usr/local/bin
          sudo chmod 0755 /usr/local/bin
          curl --fail --location --retry 3 --output /tmp/bubblewrap.tar.xz https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz
          tar -C /tmp -xf /tmp/bubblewrap.tar.xz
          meson setup /tmp/bubblewrap-0.11.2/_build /tmp/bubblewrap-0.11.2 -Dtests=false
          meson compile -C /tmp/bubblewrap-0.11.2/_build
          sudo install -o root -g root -m 0755 /tmp/bubblewrap-0.11.2/_build/bwrap /usr/local/bin/bwrap
          for name in sh python3 git; do
            SOURCE="$(readlink -f "$(command -v "$name")")"
            sudo install -o root -g root -m 0755 "$SOURCE" "/usr/local/bin/$name"
          done
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run strict targeted Task 16 gate
        if: steps.recorded.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cargo test -p kodegpt-protocol
          pnpm test:protocol
          pnpm typecheck
          cargo test -p kodegpt-runtime process -- --nocapture
          pnpm exec vitest run tests/security/process-policy.test.ts
          pnpm --filter @kodegpt/core test
          pnpm --filter @kodegpt/mcp-server test
          pnpm exec vitest run tests/integration/mcp-stdio.test.ts tests/integration/mcp-http.test.ts
      - name: Record functional targeted PASS
        if: steps.recorded.outputs.skip != 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p docs/implementation/evidence
          cat > docs/implementation/evidence/.task16-functional-targeted-pass.txt <<'EOF'
          Task 16 functional targeted verification PASS
          cargo protocol: PASS
          TypeScript protocol parity: PASS
          TypeScript typecheck: PASS
          Rust functional process matrix: PASS
          process-policy security regression: PASS
          core tests: PASS
          MCP package tests: PASS
          MCP stdio+HTTP integration: PASS
          EOF
          git config user.name "kodegpt-task16-verifier"
          git config user.email "kodegpt-task16-verifier@users.noreply.github.com"
          git add docs/implementation/evidence/.task16-functional-targeted-pass.txt
          git commit -m "chore(ci): record temporary Task 16 functional pass"
          git push origin "HEAD:${HEAD_BRANCH}"
