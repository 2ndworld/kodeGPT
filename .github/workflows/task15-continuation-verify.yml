name: Task 15 continuation verification

on:
  pull_request:
    branches:
      - feat/kodegpt-v0.1-execution-wt

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Bubblewrap 0.11.2 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libcap-dev libselinux1-dev

      - name: Build trusted Bubblewrap 0.11.2
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/bubblewrap.tar.xz \
            https://github.com/containers/bubblewrap/releases/download/v0.11.2/bubblewrap-0.11.2.tar.xz
          tar -C /tmp -xf /tmp/bubblewrap.tar.xz
          meson setup /tmp/bubblewrap-0.11.2/_build /tmp/bubblewrap-0.11.2 -Dtests=false
          meson compile -C /tmp/bubblewrap-0.11.2/_build
          sudo install -o root -g root -m 0755 /tmp/bubblewrap-0.11.2/_build/bwrap /usr/local/bin/bwrap
          /usr/local/bin/bwrap --version
          stat -c '%u:%g %a %n' /usr/local/bin/bwrap

      - name: Install trusted Git fixture
        run: |
          GIT_CANONICAL="$(readlink -f /usr/bin/git)"
          sudo install -o root -g root -m 0755 "$GIT_CANONICAL" /usr/local/bin/git
          /usr/local/bin/git --version
          stat -c '%u:%g %a %n' /usr/local/bin/git

      - name: Allow unprivileged user namespaces on ephemeral CI runner
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Verify protocol parity
        run: |
          cargo test -p kodegpt-protocol
          pnpm test:protocol

      - name: Verify Task 15 Rust Git path
        run: cargo test -p kodegpt-runtime git -- --nocapture

      - name: Verify Task 15 security regression
        run: pnpm exec vitest run tests/security/git-helper-isolation.test.ts

      - name: Verify core and MCP surfaces
        run: |
          pnpm --filter @kodegpt/core test
          pnpm --filter @kodegpt/mcp-server test
          pnpm exec vitest run tests/integration/mcp-stdio.test.ts tests/integration/mcp-http.test.ts
