<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KodeGPT Dev Console</title>
  <style>
    :root{font-family:ui-sans-serif,system-ui,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:14px;background:transparent;color:CanvasText}#app{display:grid;gap:12px}header,footer,.section-heading,.evidence-row,.row-meta{display:flex;align-items:center;gap:8px}header{justify-content:space-between}nav{display:flex;gap:6px;overflow:auto}button{font:inherit;border:1px solid color-mix(in srgb,CanvasText 22%,transparent);background:Canvas;border-radius:8px;padding:7px 10px;color:CanvasText;cursor:pointer}button.active{font-weight:700;border-color:CanvasText}main{min-height:180px;display:grid;gap:10px}.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}section,aside{border:1px solid color-mix(in srgb,CanvasText 14%,transparent);border-radius:10px;padding:11px}.card h2,section h2{font-size:13px;margin:0 0 9px}.facts{display:grid;gap:7px;margin:0}.facts div{display:grid;grid-template-columns:minmax(68px,.75fr) minmax(0,1.25fr);gap:8px;align-items:start}.facts dt{font-size:11px;opacity:.62}.facts dd{margin:0;font-size:12px;overflow-wrap:anywhere}.stack{display:grid;gap:0}.evidence-row{justify-content:space-between;padding:8px 0;border-bottom:1px solid color-mix(in srgb,CanvasText 9%,transparent)}.evidence-row:last-child{border-bottom:0}.row-meta{justify-content:flex-end;flex-wrap:wrap}.badge{font:700 10px ui-monospace,monospace;border:1px solid color-mix(in srgb,CanvasText 16%,transparent);border-radius:999px;padding:3px 6px}.actions{display:grid;gap:8px;margin:0;padding-left:18px}.actions li{font-size:12px}.actions span{display:block;margin-top:2px;opacity:.66}.empty{font-size:12px;opacity:.6;margin:0}.section-heading{justify-content:space-between}.section-heading h2{margin:0}.mono,code,pre{font-family:ui-monospace,monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:12px;line-height:1.45}.subtle{opacity:.65}.status{font:700 12px ui-monospace,monospace}footer{justify-content:flex-start;flex-wrap:wrap}.more{font-size:12px;opacity:.8}@media(max-width:520px){body{padding:10px}.card-grid{grid-template-columns:1fr}.facts div{grid-template-columns:90px minmax(0,1fr)}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>/*__KODEGPT_APP_BUNDLE__*/</script>
</body>
</html>
